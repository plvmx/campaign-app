  <p style="font-size: 22px;">Please tap the big blue button below to continue with the AFJ Campaign App.</p>
  <p>
    <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
       style="display: block; background-color: #1d4ed8; color: #ffffff; font-size: 30px; font-weight: bold; text-align: center; text-decoration: none; padding: 20px 12px; border-radius: 8px;">CONFIRM NOW</a>

</div>
